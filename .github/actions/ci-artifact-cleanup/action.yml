name: Remove consumed temporary CI artifacts
description: Delete exact trusted upload IDs after their final consumers without listing artifacts.
inputs:
  artifact-ids:
    description: JSON array of IDs from this workflow's upload outputs; never user-supplied IDs.
    required: true
runs:
  using: composite
  steps:
    - name: Clean up this attempt's consumed evidence
      if: always()
      shell: python
      env:
        GH_TOKEN: ${{ github.token }}
        FOUNDATION_CI_CLEANUP_ARTIFACT_IDS: ${{ inputs.artifact-ids }}
      run: |
        import subprocess, sys
        subprocess.run([sys.executable, '-B', 'tools/ci_cleanup.py'], check=True)
