name: Clean preceding full workflow evidence
'on':
  workflow_dispatch:
    inputs:
      expire_now:
        description: Remove completed eligible auxiliary drafts without the normal 24-hour grace
        type: boolean
        default: false
  schedule:
  - cron: '23 7 * * *'
  workflow_run:
    workflows:
    - Candidate checks
    - _Publish new Latest release
    - Certify exact published candidate
    - Prepared SDK application and candidate
    types: [completed]
permissions:
  contents: write
  actions: write
concurrency:
  group: foundation-manual-artifact-cleanup
  cancel-in-progress: false
jobs:
  cleanup:
    if: github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_repository.id == github.event.repository.id)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        # workflow_run has write access: execute only the trusted default branch.
        ref: ${{ github.event.repository.default_branch }}
        persist-credentials: false
    - name: Prune exact preceding full-run temporary evidence
      if: github.event_name == 'workflow_run'
      env:
        GH_TOKEN: ${{ github.token }}
      run: python3 -B tools/ci_cleanup_previous.py
    - name: Expire completed auxiliary drafts
      if: github.event_name != 'workflow_run'
      env:
        GH_TOKEN: ${{ github.token }}
        CLEANUP_EXPIRE_NOW: ${{ github.event_name == 'workflow_dispatch' && inputs.expire_now || false }}
      run: python3 -B tools/ci_cleanup_expired.py
